name: Backend CI
on:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: hanoflow
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U ci -d hanoflow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci-only-password@127.0.0.1:5434/hanoflow
      TEST_DATABASE_URL: postgresql://ci:ci-only-password@127.0.0.1:5434/hanoflow_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:validate
      - name: Create isolated test database
        run: docker exec ${{ job.services.postgres.id }} createdb -U ci hanoflow_test
      - run: npm run db:migrate:deploy
      - run: npm run test:db
  redis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Start isolated pinned Redis and provision identity
        run: npm run redis:test:up
      - name: Verify real jobs, retry, outage, persistence and shutdown
        run: npm run test:redis
      - name: Stop only the verified isolated Redis container
        if: always()
        run: npm run redis:test:stop
